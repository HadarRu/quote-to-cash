<!doctype html>
<!-- Web document shell (single-page output): Hebrew, right to left. -->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- react-native-web's recommended reset: full-height root, scrolling inside ScrollViews. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript>יש להפעיל JavaScript כדי להשתמש באפליקציה.</noscript>
    <div id="root"></div>
  </body>
</html>
