# Fresh install, then sign in with phone env PHONE using the local test OTP
# (supabase/config.toml). A seeded user lands on Home; a new phone lands on
# business setup. Each flow uses its own phone: Auth allows one code request
# per phone per minute.
appId: com.quotetocash.app
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible:
        id: onboarding-skip
    commands:
      - tapOn:
          id: onboarding-skip
- extendedWaitUntil:
    visible:
      id: sign-in-phone
    timeout: 60000
- tapOn:
    id: sign-in-phone
- inputText: '${PHONE}'
- tapOn:
    id: sign-in-send
- tapOn:
    id: sign-in-code
- inputText: '123456'
- tapOn:
    id: sign-in-verify
- extendedWaitUntil:
    visible:
      id: 'home-new-quote|setup-name'
    timeout: 30000
