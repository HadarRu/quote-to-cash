# Maestro types ASCII only on Android, so test input is in English.
# Adds one free-text line (description from env LINE) to the open quote editor: 2 × ₪250.
appId: com.quotetocash.app
---
- scrollUntilVisible:
    element:
      id: quote-add-free-line
- tapOn:
    id: quote-add-free-line
- tapOn:
    id: quote-line-description
- inputText: '${LINE}'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: quote-line-quantity
- tapOn:
    id: quote-line-quantity
- eraseText
- inputText: '2'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: quote-line-price
- tapOn:
    id: quote-line-price
- inputText: '250'
- hideKeyboard
