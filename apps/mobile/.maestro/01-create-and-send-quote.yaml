# Critical path 1, the business's side: create a customer and a quote, send it,
# get the customer link. (The customer's side, approving and booking a visit,
# runs in the browser: tests/portal/live.spec.ts and tests/integration.)
appId: com.quotetocash.app
name: Create customer and quote, send
---
- runFlow:
    file: subflows/sign-in.yaml
    env:
      PHONE: '0500000001' # owner A
- runFlow:
    file: subflows/create-and-send-quote.yaml
    env:
      CUSTOMER: 'Maestro Customer'
      LINE: 'Living room socket'
