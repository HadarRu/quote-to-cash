name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Install, typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Coverage report
        run: |
          pnpm coverage
          node -e "const t=require('./coverage/coverage-summary.json').total;console.log('### Unit test coverage\n\n| | % |\n|---|---|\n'+['lines','statements','functions','branches'].map(k=>'| '+k+' | '+t[k].pct+' |').join('\n'))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Build
        run: pnpm build
        env:
          EXPO_NO_TELEMETRY: '1'
          NEXT_TELEMETRY_DISABLED: '1'

  database:
    name: Migrations, RLS tests, generated types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start local Postgres
        run: pnpm exec supabase db start

      - name: Reset database (migrations + seed)
        run: pnpm supabase:reset

      - name: pgTAP tests
        run: pnpm supabase:test

      - name: Generated types are up to date
        run: |
          pnpm supabase:types
          git diff --exit-code -- packages/types/src/database.types.ts

  integration:
    name: Edge Functions, API, RLS, security, portal E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor,mailpit

      - name: Serve Edge Functions
        run: |
          eval "$(pnpm exec supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
          printf 'TOKEN_PEPPER=%s\nPUBLIC_APP_URL=http://localhost:3000\n' "$(openssl rand -hex 32)" > "$RUNNER_TEMP/functions.env"
          nohup pnpm exec supabase functions serve --env-file "$RUNNER_TEMP/functions.env" > "$RUNNER_TEMP/functions.log" 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:54321/functions/v1/public-quote/x || true)
            [ "$code" = 404 ] && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/functions.log"; exit 1

      - name: Integration tests
        run: pnpm test:integration

      - name: Build the portal against the local stack
        run: pnpm --filter @q2c/web build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Install Chromium
        run: pnpm --filter @q2c/tests exec playwright install --with-deps chromium

      - name: Portal E2E (Playwright)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/playwright-report/
            tests/test-results/
          if-no-files-found: ignore

      - name: Edge Function logs
        if: failure()
        run: cat "$RUNNER_TEMP/functions.log"

  mobile-e2e:
    name: Mobile E2E (Maestro, Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase and Edge Functions
        run: |
          pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor,mailpit
          printf 'TOKEN_PEPPER=%s\nPUBLIC_APP_URL=http://localhost:3000\n' "$(openssl rand -hex 32)" > "$RUNNER_TEMP/functions.env"
          nohup pnpm exec supabase functions serve --env-file "$RUNNER_TEMP/functions.env" > "$RUNNER_TEMP/functions.log" 2>&1 &
          # The emulator reaches the host at 10.0.2.2; app.config.ts reads the root .env.
          eval "$(pnpm exec supabase status -o env)"
          printf 'SUPABASE_URL=http://10.0.2.2:54321\nSUPABASE_ANON_KEY=%s\n' "$ANON_KEY" > .env

      - name: Build the Android app
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --no-install
          # CI only: the local stack is plain HTTP.
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml
          cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            maestro test apps/mobile/.maestro --format junit --output maestro-report.xml --debug-output maestro-debug

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro
          path: |
            maestro-report.xml
            maestro-debug/
            ~/.maestro/tests/
          if-no-files-found: ignore
